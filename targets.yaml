# SolveIt Sidekick — target profiles
#
# A "target" is just a SolveIt server the client connects to. The whole
# local-vs-H100 problem collapses into: which target is active right now.
#
# - `local`  : a SolveIt server running on your laptop (localhost:5001).
# - `h100`   : a SolveIt server running on the remote H100 box. We never expose
#              5001 to the internet; instead `sidekick up h100` opens an SSH
#              tunnel so the remote port shows up on a local port, and the
#              client talks to *that*. Same client code, both targets.
#
# Token notes (from solveit_client):
#   - localhost accepts the dummy token, so `local` needs no real secret.
#   - hosted/remote instances need your real `_solveit` cookie value. Put it in
#     the env var named below rather than committing it here.

default: local

# Models the "Ask AI" composer can route a prompt to. `id` is what we pass to
# the SolveIt server; `label` is what the UI shows. Reorder/extend freely.
default_model: codex-gpt-5.5-high    # Codex via local CLI, explicit model/effort
models:
  - id: codex-gpt-5.5-high   # Codex via local CLI; strong default for notebook help
    label: Codex · GPT-5.5 high
  - id: codex-gpt-5.5-xhigh  # deeper reasoning for harder questions
    label: Codex · GPT-5.5 xhigh
  - id: codex-gpt-5.6-luna-low  # fast/lighter Codex option
    label: Codex · GPT-5.6 Luna low
  - id: claude-fable-low   # Claude Code subscription, fast/light
    label: Claude · Fable low
  - id: claude-fable-medium
    label: Claude · Fable medium
  - id: claude-fable-high  # Claude Code subscription, fast but more deliberate
    label: Claude · Fable high
  - id: claude-fable-xhigh
    label: Claude · Fable xhigh
  - id: claude-fable-max
    label: Claude · Fable max
  - id: claude-sonnet-low
    label: Claude · Sonnet low
  - id: claude-sonnet-medium
    label: Claude · Sonnet medium
  - id: claude-sonnet-high # Claude Code subscription, balanced
    label: Claude · Sonnet high
  - id: claude-sonnet-xhigh # Claude Code subscription, deeper balanced reasoning
    label: Claude · Sonnet xhigh
  - id: claude-sonnet-max
    label: Claude · Sonnet max
  - id: claude-opus-low
    label: Claude · Opus low
  - id: claude-opus-medium
    label: Claude · Opus medium
  - id: claude-opus-high   # Claude Code subscription, strongest default
    label: Claude · Opus high
  - id: claude-opus-xhigh  # Claude Code subscription, deepest routine option
    label: Claude · Opus xhigh
  - id: claude-opus-max
    label: Claude · Opus max
  - id: claude        # Anthropic API (uses ANTHROPIC_API_KEY / prepaid credits)
    label: Claude API
  - id: glm           # Zhipu GLM
    label: GLM

# `backend` picks how the client talks to a target:
#   solveit (default) -> via solveit_client (Answer.AI's hosted/real server)
#   kernel            -> via our self-hostable server/kernel_server.py (runs code
#                        for real; great for trying the whole stack without the
#                        proprietary SolveIt image)
targets:
  local:
    url: http://localhost:5001
    token: dummy            # localhost accepts the dummy token
    backend: solveit
    ssh: null               # nothing to tunnel; server is already on this machine

  # A ready-to-run local target backed by the bundled kernel server.
  # Start it with:  python -m server.kernel_server --port 5055
  kernel:
    url: http://localhost:5055
    token: dummy
    backend: kernel
    ssh: null

  h100:
    # The client connects here. `sidekick up h100` forwards the remote
    # SolveIt port to this local port, so the URL stays localhost.
    url: http://localhost:5101
    token_env: SOLVEIT_H100_TOKEN   # `export SOLVEIT_H100_TOKEN=...` (your _solveit cookie)
    ssh:
      host: h100              # an entry in your ~/.ssh/config, or user@1.2.3.4
      remote_port: 5001       # the port SolveIt listens on, on the H100
      local_port: 5101        # local end of the tunnel (matches url above)
      # Optional: command to (re)start the SolveIt server on the H100 before
      # tunneling. Leave null if you start it yourself / it's already running.
      start_cmd: null
      # e.g. "docker start solveit" or a compose up line
