[project]
name = "solveit-sidekick"
version = "0.1.0"
description = "A Claude-desktop-style interface for SolveIt that runs against your laptop or a remote H100."
readme = "README.md"
requires-python = ">=3.10"
# --- THE SERVER -------------------------------------------------------------
# Base deps run sidekick itself: the web app, the kernel infrastructure, and the
# AI calls. Deliberately light. The libraries your *notebook code* imports are a
# separate concern — see the `kernel` extra below.
dependencies = [
    "python-fasthtml",
    "uvicorn",
    "pyyaml",
    "mistune",     # server-side markdown (notes + AI answers); offline, no CDN
    "pygments",    # server-side code syntax highlighting; offline, no CDN
    "pypdf",       # lightweight PDF text extraction for the reading panel (fallback)
    "anthropic",   # Ask AI → Claude (API key)
    "openai",      # Ask AI → Codex
    "zhipuai",     # Ask AI → GLM
]

[project.optional-dependencies]
# --- THE PYTHON-CODING ENVIRONMENT ------------------------------------------
# What `import …` in a code cell can use. Kept out of the base install because
# (a) torch is large and (b) the kernel server is a standalone HTTP process, so
# this stack belongs wherever the kernel actually runs — which can be a separate
# venv, or the H100 — while the app stays lean. Install it where the kernel runs:
#   uv pip install "solveit-sidekick[kernel]"                          # one venv, or
#   uv run --extra kernel python -m server.kernel_server --port 5055   # kernel only
kernel = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "torch",
]
ml = ["solveit-sidekick[kernel]"]   # back-compat alias for the former name

# High-quality PDF → markdown for reading papers: marker preserves structure,
# tables, and equations as LaTeX (rendered by our mistune + KaTeX). Heavy (uses
# torch + downloads models on first use) and GPL-3.0, so opt-in; without it the
# reading panel falls back to pypdf text extraction.
#   uv pip install "solveit-sidekick[paper]"
paper = ["marker-pdf"]

# Talk to the real Answer.AI SolveIt server instead of the bundled kernel.
solveit = ["solveit_client"]
dev = ["pytest"]

# Everything for a full local workstation in one shot (server + coding stack + solveit).
all = [
    "solveit-sidekick[kernel]",
    "solveit-sidekick[solveit]",
]

[project.scripts]
sidekick = "sidekick.cli:main"

[tool.uv]
# Dependency-only project: uv manages the venv without trying to build/install
# the source tree as a wheel (we run it in-place with `python -m`).
package = false

[dependency-groups]
dev = ["pytest"]
